[package]
name = "skillhive-desktop"
version = "0.1.0"
description = "SkillHive desktop client"
authors = ["SkillHive contributors"]
license = "MIT"
repository = "https://github.com/somnifex/SkillHive"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "skillhive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
