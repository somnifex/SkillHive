[project]
name = "skillhive"
version = "0.1.0"
description = "Team skill management platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "alembic>=1.16.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.10.0",
  "pyjwt>=2.10.0",
  "pymysql>=1.1.1",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.20",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/somnifex/SkillHive"
Documentation = "https://github.com/somnifex/SkillHive/tree/main/makewiki"
Repository = "https://github.com/somnifex/SkillHive.git"
Issues = "https://github.com/somnifex/SkillHive/issues"

[dependency-groups]
dev = [
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
  "uv==0.11.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", "backend/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["backend/migrations"]

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true
